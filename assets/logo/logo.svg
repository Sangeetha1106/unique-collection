<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 85" width="520" height="85">
  <defs>
    <style>
      @import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&amp;family=Jost:wght@600;700&amp;display=swap');
      .title-text {
        font-family: 'Playfair Display', Georgia, serif;
        font-size: 34px;
        font-weight: 700;
        letter-spacing: 2.2px;
        fill: #171316;
      }
      .title-text-u {
        fill: #C76A91;
      }
      .sub-text {
        font-family: 'Jost', 'Segoe UI', Arial, sans-serif;
        font-size: 13.5px;
        font-weight: 700;
        letter-spacing: 4.8px;
        fill: #B8860B;
      }
      .divider-line {
        stroke: #DDB89E;
        stroke-width: 1.5;
      }
      .diamond {
        fill: #C5A15B;
      }
    </style>
  </defs>
  
  <!-- Crest Icon -->
  <image href="data:image/png;base64," x="0" y="0" width="96" height="85" preserveAspectRatio="xMidYMid meet" />
  
  <!-- Brand Name -->
  <text x="108" y="42" class="title-text"><tspan class="title-text-u">UNIQUE</tspan> COLLECTION</text>
  
  <!-- Decorative Divider Line with Center Diamond -->
  <line x1="108" y1="53" x2="505" y2="53" class="divider-line" />
  <polygon points="306,48 311,53 306,58 301,53" class="diamond" />
  
  <!-- Tagline -->
  <text x="110" y="73" class="sub-text">FASHION  •  JEWELLERY  •  YOU</text>
</svg>